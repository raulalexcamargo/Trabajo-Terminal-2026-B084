name: banco
description: "App de monitoreo del banco de baterías (BMS)."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.3.2   # guarda la última IP usada
  audioplayers: ^6.1.0         # sonido de las alertas
  # flutter_bluetooth_serial se quitó: la app ahora usa WiFi (borra lib/bms_bt.dart)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sonidos/
